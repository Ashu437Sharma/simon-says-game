<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon says</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <h1>Simon Says Game</h1>
    <h2>Press any key to start the game</h2>
    <div class="box">
        <div class="box1">
            <div class="main red" id="red" type="button">1</div>
            <div class="main green" id="green" type="button">2</div>
        </div>
        <div class="box2">
            <div class="main yellow" id="yellow" type="button">3</div>
            <div class="main purple" id="purple" type="button">4</div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
